<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans)}.row-s{display:flex;gap:10px}.sw{flex:1;min-width:0}.sw .c{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.05)}.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw span{font-size:11px;color:#6c757d;display:block}</style></head><body><div class="row-s"><div class="sw"><div class="c" style="background:var(--blue-950)"></div><b>Blue 950</b><span>--blue-950<br>#0c2547</span></div><div class="sw"><div class="c" style="background:var(--blue-900)"></div><b>Guardian</b><span>--blue-900<br>#153e75</span></div><div class="sw"><div class="c" style="background:var(--blue-800)"></div><b>Secondary</b><span>--blue-800<br>#1a5299</span></div><div class="sw"><div class="c" style="background:var(--blue-700)"></div><b>Gradient end</b><span>--blue-700<br>#2a6fb3</span></div><div class="sw"><div class="c" style="background:var(--blue-500)"></div><b>Focus</b><span>--blue-500<br>#4a8fd6</span></div><div class="sw"><div class="c" style="background:var(--blue-100)"></div><b>Soft</b><span>--blue-100<br>#e6effa</span></div><div class="sw"><div class="c" style="background:var(--blue-50)"></div><b>Tint</b><span>--blue-50<br>#f1f6fc</span></div></div></body></html>
