<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans)}.row-s{display:flex;gap:10px}.sw{flex:1;min-width:0}.sw .c{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.05)}.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw span{font-size:11px;color:#6c757d;display:block}</style></head><body><div class="row-s"><div class="sw"><div class="c" style="background:var(--status-paid)"></div><b>ชำระแล้ว</b><span>--status-paid<br>#198754</span></div><div class="sw"><div class="c" style="background:var(--status-unpaid)"></div><b>ยังไม่ชำระ</b><span>--status-unpaid<br>#ffc107</span></div><div class="sw"><div class="c" style="background:var(--status-expiring)"></div><b>ใกล้หมดอายุ</b><span>--status-expiring<br>#fd7e14</span></div><div class="sw"><div class="c" style="background:var(--status-overdue)"></div><b>เกินกำหนด</b><span>--status-overdue<br>#dc3545</span></div><div class="sw"><div class="c" style="background:var(--status-review)"></div><b>รอตรวจสอบ</b><span>--status-review<br>#0d6efd</span></div><div class="sw"><div class="c" style="background:var(--status-other)"></div><b>อื่นๆ</b><span>--status-other<br>#6c757d</span></div></div></body></html>
