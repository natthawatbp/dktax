<!-- @dsCard group="Brand" viewport="700x620" name="Login surface" subtitle="Gradient backdrop, white 16px card, logo top-centre, login + register" -->
<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}.bg{min-height:620px;background:var(--gradient-login);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.cardx{background:#fff;border-radius:var(--radius-login);box-shadow:var(--shadow-login);padding:32px 36px;width:100%;max-width:var(--login-card-max);text-align:center}.cardx img{width:100%;max-width:370px;display:block;margin:0 auto 16px}</style></head>
<body><div class="bg"><div class="cardx">
<img src="../assets/logo-long.png" alt="DK One Tax Bill — เทศบาลเมืองดอนแก้ว">
<h4 class="mb-1 fw-bold" style="color:var(--primary)">DK One Tax Bill</h4>
<p class="text-muted mb-3">ระบบรวมใบแจ้งภาระภาษีและค่าธรรมเนียม<br>เทศบาลเมืองดอนแก้ว</p>
<div class="mb-3 text-start"><label class="form-label fw-bold">Username</label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="fas fa-user"></i></span><input class="form-control" placeholder="เลขประจำตัวผู้เสียภาษี / Username"></div></div>
<div class="mb-4 text-start"><label class="form-label fw-bold">Password</label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="fas fa-lock"></i></span><input id="pw" type="password" class="form-control" value="admin1234"><button class="btn btn-outline-secondary" style="border-color:var(--bs-border-color)" onclick="var p=document.getElementById('pw'),i=this.firstChild;p.type=p.type==='password'?'text':'password';i.className=p.type==='password'?'fas fa-eye':'fas fa-eye-slash'"><i class="fas fa-eye"></i></button></div></div>
<button class="btn btn-primary w-100 fw-bold d-flex align-items-center justify-content-center gap-2"><i class="fas fa-sign-in-alt"></i>เข้าสู่ระบบ</button>
<button class="btn btn-outline-primary w-100 fw-medium mt-2 d-flex align-items-center justify-content-center gap-2"><i class="fas fa-user-plus"></i>ลงทะเบียน</button>
</div></div></body></html>
