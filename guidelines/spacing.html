<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans)}.row-s{display:flex;gap:10px}.sw{flex:1;min-width:0}.sw .c{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.05)}.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw span{font-size:11px;color:#6c757d;display:block}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end"><div style="text-align:center;font-size:11px;color:#6c757d"><div style="width:4px;height:4px;background:var(--blue-200);margin:0 auto 6px"></div>4px<br>--space-1</div><div style="text-align:center;font-size:11px;color:#6c757d"><div style="width:5px;height:5px;background:var(--blue-200);margin:0 auto 6px"></div>5px<br>--space-2</div><div style="text-align:center;font-size:11px;color:#6c757d"><div style="width:10px;height:10px;background:var(--blue-200);margin:0 auto 6px"></div>10px<br>--space-3</div><div style="text-align:center;font-size:11px;color:#6c757d"><div style="width:12px;height:12px;background:var(--blue-200);margin:0 auto 6px"></div>12px<br>--space-4</div><div style="text-align:center;font-size:11px;color:#6c757d"><div style="width:15px;height:15px;background:var(--blue-200);margin:0 auto 6px"></div>15px<br>--space-5</div><div style="text-align:center;font-size:11px;color:#6c757d"><div style="width:20px;height:20px;background:var(--blue-200);margin:0 auto 6px"></div>20px<br>--space-6</div><div style="text-align:center;font-size:11px;color:#6c757d"><div style="width:25px;height:25px;background:var(--blue-200);margin:0 auto 6px"></div>25px<br>--space-7</div><div style="text-align:center;font-size:11px;color:#6c757d"><div style="width:40px;height:40px;background:var(--blue-200);margin:0 auto 6px"></div>40px<br>--space-8</div></div></body></html>
