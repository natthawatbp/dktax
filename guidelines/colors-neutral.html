<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans)}.row-s{display:flex;gap:10px}.sw{flex:1;min-width:0}.sw .c{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.05)}.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw span{font-size:11px;color:#6c757d;display:block}</style></head><body><div class="row-s"><div class="sw"><div class="c" style="background:var(--white)"></div><b>Card</b><span>--white<br>#fff</span></div><div class="sw"><div class="c" style="background:var(--gray-50)"></div><b>Page bg</b><span>--gray-50<br>#f4f6f9</span></div><div class="sw"><div class="c" style="background:var(--gray-100)"></div><b>Card border</b><span>--gray-100<br>#f0f0f0</span></div><div class="sw"><div class="c" style="background:var(--gray-200)"></div><b>Divider</b><span>--gray-200<br>#e0e0e0</span></div><div class="sw"><div class="c" style="background:var(--gray-500)"></div><b>Muted</b><span>--gray-500<br>#6c757d</span></div><div class="sw"><div class="c" style="background:var(--gray-600)"></div><b>Menu text</b><span>--gray-600<br>#555</span></div><div class="sw"><div class="c" style="background:var(--gray-900)"></div><b>Text</b><span>--gray-900<br>#263238</span></div></div></body></html>
