<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans)}.row-s{display:flex;gap:10px}.sw{flex:1;min-width:0}.sw .c{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.05)}.sw b{display:block;font-size:12px;margin-top:6px;font-weight:600}.sw span{font-size:11px;color:#6c757d;display:block}</style></head><body><div style="display:flex;flex-wrap:wrap;gap:10px"><span style="padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:500;background:var(--status-paid-bg);color:var(--status-paid-fg)">ชำระแล้ว</span><span style="padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:500;background:var(--status-unpaid-bg);color:var(--status-unpaid-fg)">ยังไม่ชำระ</span><span style="padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:500;background:var(--status-expiring-bg);color:var(--status-expiring-fg)">ใกล้หมดอายุ</span><span style="padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:500;background:var(--status-overdue-bg);color:var(--status-overdue-fg)">เกินกำหนด</span><span style="padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:500;background:var(--status-review-bg);color:var(--status-review-fg)">รอตรวจสอบ</span><span style="padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:500;background:var(--status-other-bg);color:var(--status-other-fg)">อื่นๆ</span></div></body></html>
