services:
  web:
    build:
      context: .
      pull: true
    image: dk-one-tax-bill:local
    container_name: dk-one-tax-bill
    restart: unless-stopped
    init: true
    environment:
      PORT: "8080"
      TRUST_PROXY: "1"
    # Bound to loopback: expose publicly only through a TLS reverse proxy.
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
