# Hardened static server for DK One Tax Bill.
# Runs as non-root (nginx-unprivileged) on 8080. TLS terminates at a reverse proxy in front.

server_tokens off;
limit_req_zone $binary_remote_addr zone=static:10m rate=20r/s;

# One Cache-Control value per request, chosen here. Set once at server level, because an
# add_header inside a location would replace every server-level header (including CSP).
map $uri $cache_control {
    ~\.(woff2|png|css|js)$  "public, max-age=86400";
    default                 "no-cache";
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index Index.html;

    autoindex off;
    client_max_body_size 1k;
    limit_req zone=static burst=40 nodelay;

    # Security headers. "always" applies them to error responses too.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' blob: https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' blob: https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data: blob: https://cdn.imagetourls.com; connect-src 'self' blob:; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control $cache_control always;

    # Only read-only methods are served.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Never serve dotfiles, source/config/doc files, or design-tool leftovers.
    location ~ /\. { deny all; return 404; }
    location ~* (\.(md|sh|yml|yaml|oxlintrc\.json|jsx|ts|txt)|/Dockerfile)$ { deny all; return 404; }
    location ~* ^/(components|guidelines|ui_kits|uploads|deploy)/ { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

}
