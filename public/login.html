<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ - DK One Tax Bill</title>
<style>
  body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 16px; color: #263238; }
  .card { background: #fff; max-width: 560px; margin: 24px auto; padding: 24px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  h1 { font-size: 1.3rem; color: #153e75; margin-top: 0; }
  h2 { font-size: 1.05rem; color: #153e75; margin: 22px 0 6px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  button { margin-top: 14px; padding: 10px 18px; background: #153e75; color: #fff; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button.secondary { background: #6c757d; }
  .msg { margin-top: 12px; padding: 10px; border-radius: 8px; display: none; }
  .ok { background: #d4edda; color: #155724; }
  .err { background: #f8d7da; color: #721c24; }
  .hint { color: #6c757d; font-size: .9rem; }
  .result { margin-top: 10px; padding: 10px; background: #f4f6f9; border-radius: 8px; white-space: pre-wrap; display: none; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card" id="login-card">
  <h1>เข้าสู่ระบบ</h1>
  <form id="login-form">
    <label>ชื่อผู้ใช้<input id="l-user" autocomplete="username" required></label>
    <label>รหัสผ่าน<input id="l-pass" type="password" autocomplete="current-password" required></label>
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
  <div id="login-msg" class="msg"></div>
</div>

<div class="card hidden" id="panel">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
    <div>ผู้ใช้: <b id="who"></b> (<span id="role"></span>)</div>
    <button class="secondary" id="logout">ออกจากระบบ</button>
  </div>
  <div id="panel-msg" class="msg"></div>

  <div id="section-register" class="hidden">
    <h2>ลงทะเบียนผู้เสียภาษี</h2>
    <form id="register-form">
      <label>รหัสผู้เสียภาษีภายใน (ตัวอักษรอังกฤษ ตัวเลข _ - ไม่เกิน 64 ตัว)<input id="r-id" required></label>
      <label>เลขประจำตัวประชาชน หรือ เลขนิติบุคคล (13 หลัก)<input id="r-nid" inputmode="numeric" required></label>
      <button type="submit">บันทึก</button>
    </form>
  </div>

  <div id="section-lookup" class="hidden">
    <h2>ค้นหาด้วยเลขประจำตัว (13 หลัก)</h2>
    <form id="lookup-form">
      <label>เลขประจำตัว<input id="s-nid" inputmode="numeric" required></label>
      <button type="submit">ค้นหา</button>
    </form>
  </div>

  <div id="section-view" class="hidden">
    <h2>ดูข้อมูลด้วยรหัสผู้เสียภาษี</h2>
    <form id="view-form">
      <label>รหัสผู้เสียภาษีภายใน<input id="v-id" required></label>
      <button type="submit">ดู</button>
    </form>
  </div>

  <div id="section-reveal" class="hidden">
    <h2>เปิดเลขเต็ม (ผู้ดูแลระบบเท่านั้น)</h2>
    <p class="hint">ต้องระบุเหตุผล ระบบจะบันทึกทุกครั้ง และจำกัดไม่เกิน 10 ครั้งต่อชั่วโมง</p>
    <form id="reveal-form">
      <label>รหัสผู้เสียภาษีภายใน<input id="x-id" required></label>
      <label>เหตุผล (อย่างน้อย 10 ตัวอักษร)<input id="x-reason" required minlength="10" maxlength="200"></label>
      <button type="submit">เปิดเลขเต็ม</button>
    </form>
  </div>

  <div id="result" class="result"></div>
</div>

<script>
  const ROLE_NAMES = { admin: 'ผู้ดูแลระบบ', revenue: 'เจ้าหน้าที่จัดเก็บรายได้', finance: 'เจ้าหน้าที่การเงิน', health: 'เจ้าหน้าที่สาธารณสุข', exec: 'ผู้บริหาร' };
  const ERRORS = {
    invalid_credentials: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
    unauthenticated: 'กรุณาเข้าสู่ระบบอีกครั้ง',
    forbidden: 'บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้',
    invalid_national_id: 'เลขประจำตัวไม่ถูกต้อง ตรวจว่ามี 13 หลักและพิมพ์ถูก',
    invalid_taxpayer_id: 'รหัสผู้เสียภาษีมีอักขระที่ไม่อนุญาต',
    already_exists: 'มีข้อมูลนี้อยู่แล้ว',
    not_found: 'ไม่พบข้อมูล',
    reason_required: 'กรุณาระบุเหตุผลอย่างน้อย 10 ตัวอักษร',
    reveal_limit: 'เปิดเลขเต็มครบจำนวนที่กำหนดในชั่วโมงนี้แล้ว ลองใหม่ภายหลัง',
    view_limit: 'ดูข้อมูลครบ 100 รายการในชั่วโมงนี้แล้ว ลองใหม่ภายหลัง',
    too_many_requests: 'ส่งคำขอถี่เกินไป กรุณารอสักครู่',
  };

  const $ = (id) => document.getElementById(id);
  const show = (id, text, ok) => { const m = $(id); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.style.display = 'block'; };
  const showResult = (text) => { const r = $('result'); r.textContent = text; r.style.display = 'block'; };

  async function api(method, url, body) {
    const r = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    return { status: r.status, data };
  }
  const errText = (data, status) => ERRORS[data.error] || (status === 429 ? ERRORS.too_many_requests : 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง');

  // Shows the full ID when the server sent it (admin, revenue, finance); otherwise the masked form.
  const describe = (d) => 'รหัสผู้เสียภาษี: ' + d.taxpayer_id + '\nเลขประจำตัว: ' + (d.national_id || d.nid_masked);

  function enter(user) {
    $('login-card').classList.add('hidden');
    $('panel').classList.remove('hidden');
    $('who').textContent = user.username;
    $('role').textContent = ROLE_NAMES[user.role] || user.role;
    const role = user.role;
    const canRegister = ['admin', 'revenue'].includes(role);
    const canLookup = ['admin', 'revenue', 'finance'].includes(role);
    $('section-register').classList.toggle('hidden', !canRegister);
    $('section-lookup').classList.toggle('hidden', !canLookup);
    $('section-view').classList.remove('hidden');
    $('section-reveal').classList.toggle('hidden', role !== 'admin');
  }
  function leave() {
    $('panel').classList.add('hidden');
    $('login-card').classList.remove('hidden');
    $('result').style.display = 'none';
  }

  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { status, data } = await api('POST', '/api/login', { username: $('l-user').value, password: $('l-pass').value });
    if (status === 200) { $('l-pass').value = ''; enter(data); }
    else show('login-msg', errText(data, status), false);
  });
  $('logout').addEventListener('click', async () => { await api('POST', '/api/logout', {}); leave(); });

  $('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { status, data } = await api('POST', '/api/taxpayers', { taxpayer_id: $('r-id').value, national_id: $('r-nid').value });
    if (status === 201) { show('panel-msg', 'บันทึกสำเร็จ เลขที่บันทึก: ' + data.nid_masked, true); $('r-nid').value = ''; }
    else show('panel-msg', errText(data, status), false);
  });
  $('lookup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { status, data } = await api('POST', '/api/taxpayers/lookup', { national_id: $('s-nid').value });
    if (status === 200) showResult(describe(data));
    else show('panel-msg', errText(data, status), false);
  });
  $('view-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = encodeURIComponent($('v-id').value);
    const { status, data } = await api('GET', '/api/taxpayers/' + id);
    if (status === 200) showResult(describe(data));
    else show('panel-msg', errText(data, status), false);
  });
  $('reveal-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = encodeURIComponent($('x-id').value);
    const { status, data } = await api('POST', '/api/taxpayers/' + id + '/reveal', { reason: $('x-reason').value });
    if (status === 200) { showResult('เลขเต็ม: ' + data.national_id + '\n(ข้อมูลนี้ถูกบันทึกในประวัติแล้ว)'); $('x-reason').value = ''; }
    else show('panel-msg', errText(data, status), false);
  });

  // If a session already exists, go straight to the panel.
  api('GET', '/api/me').then(({ status, data }) => { if (status === 200) enter(data); });
</script>
</body>
</html>
