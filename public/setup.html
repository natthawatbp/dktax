<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งค่าผู้ดูแลระบบคนแรก - DK One Tax Bill</title>
<style>
  body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 24px; color: #263238; }
  .card { background: #fff; max-width: 440px; margin: 40px auto; padding: 28px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  h1 { font-size: 1.3rem; color: #153e75; margin-top: 0; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  button { margin-top: 20px; width: 100%; padding: 12px; background: #153e75; color: #fff; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button:disabled { background: #8a9bb5; }
  .msg { margin-top: 16px; padding: 10px; border-radius: 8px; display: none; }
  .ok { background: #d4edda; color: #155724; }
  .err { background: #f8d7da; color: #721c24; }
  .hint { color: #6c757d; font-size: .9rem; }
</style>
</head>
<body>
<div class="card">
  <h1>ตั้งค่าผู้ดูแลระบบคนแรก</h1>
  <p class="hint">ใช้หน้านี้ได้ครั้งเดียว เมื่อมีผู้ดูแลแล้วหน้านี้จะใช้ไม่ได้</p>
  <form id="f">
    <label>รหัสตั้งค่า (ได้จากผู้ดูแลเซิร์ฟเวอร์)
      <input id="token" type="password" autocomplete="off" required>
    </label>
    <label>ชื่อผู้ใช้ (ตัวอักษรอังกฤษ ตัวเลข _ . - ยาว 3–32 ตัว)
      <input id="username" autocomplete="off" required>
    </label>
    <label>รหัสผ่าน (อย่างน้อย 12 ตัว)
      <input id="password" type="password" autocomplete="new-password" required minlength="12">
    </label>
    <label>พิมพ์รหัสผ่านอีกครั้ง
      <input id="password2" type="password" autocomplete="new-password" required minlength="12">
    </label>
    <button id="btn" type="submit">สร้างผู้ดูแลระบบ</button>
  </form>
  <div id="msg" class="msg"></div>
  <p class="hint"><a href="/login.html">ไปหน้าเข้าสู่ระบบ</a></p>
</div>
<script>
  const ERRORS = {
    forbidden: 'รหัสตั้งค่าไม่ถูกต้อง',
    invalid_username: 'ชื่อผู้ใช้ไม่ถูกต้อง',
    weak_password: 'รหัสผ่านต้องมีอย่างน้อย 12 ตัว',
    already_exists: 'ชื่อผู้ใช้นี้มีอยู่แล้ว',
    not_found: 'หน้านี้ปิดใช้งานแล้ว เพราะมีผู้ดูแลระบบอยู่แล้ว',
  };
  const show = (text, ok) => {
    const m = document.getElementById('msg');
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : 'err');
    m.style.display = 'block';
  };
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    if (password !== document.getElementById('password2').value) return show('รหัสผ่านทั้งสองช่องไม่ตรงกัน', false);
    const btn = document.getElementById('btn');
    btn.disabled = true;
    try {
      const r = await fetch('/api/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: document.getElementById('token').value,
          username: document.getElementById('username').value,
          password,
        }),
      });
      const data = await r.json().catch(() => ({}));
      if (r.status === 201) {
        show('สร้างผู้ดูแลระบบสำเร็จ ให้ไปที่หน้าเข้าสู่ระบบ', true);
        document.getElementById('f').reset();
      } else {
        show(ERRORS[data.error] || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง', false);
      }
    } catch {
      show('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', false);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
